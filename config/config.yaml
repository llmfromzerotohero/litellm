  # Ollama (local)
  - model_name: qwen3:1.7b
    litellm_params:
      model: ollama/qwen3:1.7b
      api_base: http://ollama:11434
  
  - model_name: qwen3.5:4b
    litellm_params:
      model: ollama/qwen3.5:4b
      api_base: http://ollama:11434
  
  - model_name: gemma3:1b
    litellm_params:
      model: ollama/gemma3:1b
      api_base: http://ollama:11433 # Porta errada para forçar Fallback
  
  # vLLM (local)
  - model_name: qwen3.5:2b
    litellm_params:
      model: openai/qwen3.5:9b
      api_base: http://vllm:8000/v1

litellm_settings:
  success_callback: ["langfuse"]   # opcional: observabilidade
  store_model_in_db: true

router_settings:
  fallbacks:
    - {"gemma3:1b": ["qwen3:1.7b"]}
    - {"qwen3.5:4b": ["qwen3:1.7b"]}
    - {"qwen3.5:2b": ["qwen3:1.7b"]}

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY       # chave admin
  database_url: os.environ/DATABASE_URL