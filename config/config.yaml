model_list:
  # # OpenAI
  # - model_name: gpt-4o
  #   litellm_params:
  #     model: openai/gpt-4o
  #     api_key: os.environ/OPENAI_API_KEY

  # # Google Gemini
  # - model_name: gemini-1.5-flash
  #   litellm_params:
  #     model: gemini/gemini-1.5-flash
  #     api_key: os.environ/GEMINI_API_KEY

  # Ollama (local)
  - model_name: qwen3:1.7b
    litellm_params:
      model: ollama/qwen3:1.7b
      api_base: http://ollama:11434
      input_cost_per_token: 0.0000005     # $0.50 por milhão de tokens
      output_cost_per_token: 0.0000007    # $0.70 por milhão de tokens
  
  - model_name: gemma3:1b
    litellm_params:
      model: ollama/gemma3:1b
      api_base: http://ollama:11433 # Porta errada para forçar Fallback
      input_cost_per_token: 0.0000003     # $0.30 por milhão de tokens
      output_cost_per_token: 0.0000004    # $0.40 por milhão de tokens
  
  - model_name: qwen3:0.6b
    litellm_params:
      model: ollama/qwen3:0.6b
      api_base: http://ollama:11434
      input_cost_per_token: 0.0000002     # $0.20 por milhão de tokens
      output_cost_per_token: 0.0000003    # $0.30 por milhão de tokens
  
  # - model_name: qwen3:4b
  #   litellm_params:
  #     model: ollama/qwen3:4b
  #     api_base: http://ollama:11434
  
  # vLLM (local)
  - model_name: qwen3.5:9b
    litellm_params:
      model: openai/qwen3.5:9b
      api_base: http://vllm:8000/v1
      input_cost_per_token: 0.0000030     # $3.00 por milhão de tokens
      output_cost_per_token: 0.0000045    # $4.50 por milhão de tokens
  
  - model_name: qwen3.5:2b
    litellm_params:
      model: openai/Qwen/Qwen3.5-2B
      api_base: http://vllm:8000/v1
      input_cost_per_token: 0.0000010     # $1.00 por milhão de tokens
      output_cost_per_token: 0.0000025    # $2.50 por milhão de tokens
  

litellm_settings:
  success_callback: ["langfuse"]   # opcional: observabilidade
  store_model_in_db: true

router_settings:
  fallbacks:
    - {"gemma3:1b": ["qwen3:1.7b"]}
    - {"qwen3.5:4b": ["qwen3:1.7b"]}
    - {"qwen3.5:9b": ["qwen3:1.7b"]}
    - {"qwen3.5:2b": ["qwen3:1.7b"]}

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY       # chave admin
  database_url: os.environ/DATABASE_URL